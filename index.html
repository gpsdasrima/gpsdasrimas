<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      CSP de reserva via meta tag. O reforço de verdade vem pelos headers
      HTTP (ver public/_headers e vercel.json), que cobrem diretivas que a
      tag <meta> não suporta (como frame-ancestors). Isso aqui só garante
      alguma proteção mesmo em hosts estáticos que não permitem configurar
      headers customizados.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://router.project-osrm.org; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <title>GPS DAS RIMAS — O mapa nacional das batalhas de rima</title>
    <meta
      name="description"
      content="O mapa nacional das batalhas de rima. Encontre batalhas perto de você, descubra novos MCs e divulgue sua batalha no GPS DAS RIMAS."
    />
    <meta name="author" content="Gustavo Neves" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GPS DAS RIMAS" />
    <meta property="og:title" content="GPS DAS RIMAS — O mapa nacional das batalhas de rima" />
    <meta
      property="og:description"
      content="O mapa nacional das batalhas de rima. Encontre batalhas perto de você, descubra novos MCs e divulgue sua batalha."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GPS DAS RIMAS — O mapa nacional das batalhas de rima" />
    <meta
      name="twitter:description"
      content="O mapa nacional das batalhas de rima. Encontre batalhas perto de você."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
